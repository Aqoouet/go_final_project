name: Go Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.x'
        
    - name: Install CGO dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc libc6-dev

    - name: Download dependencies
      run: go mod download

    - name: Build application
      run: CGO_ENABLED=1 go build -o scheduler ./cmd/scheduler

    - name: Run tests
      run: |
        ./scheduler &
        SERVER_PID=$!
        sleep 2
        go test ./tests/... -v
        kill $SERVER_PID || true
      env:
        TODO_PORT: 7540
        TODO_DBFILE: test_scheduler.db
